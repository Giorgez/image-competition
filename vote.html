<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ხმის მიცემა</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="nav-brand">ფოტო კონკურსი</span>
    <span class="nav-user" id="navUser"></span>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button class="nav-btn" onclick="window.location.href='results.html'">შედეგები</button>
      <button class="nav-btn" onclick="logout()">გამოსვლა</button>
    </div>
  </nav>

  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="prog-text" id="progText"></div>

  <div class="filters">
    <button class="filter-btn active" data-f="all"    onclick="setFilter('all',this)">ყველა</button>
    <button class="filter-btn"        data-f="unvoted" onclick="setFilter('unvoted',this)">ხმადაუცემელი</button>
    <button class="filter-btn"        data-f="voted"   onclick="setFilter('voted',this)">ხმადაცემული</button>
  </div>

  <div class="grid" id="grid"></div>

  <div style="padding:16px 20px;text-align:center">
    <button class="btn btn-primary" id="doneBtn" style="display:none" onclick="window.location.href='results.html'">
      ✓ შედეგების ნახვა
    </button>
  </div>

  <!-- Voting Modal -->
  <div class="overlay" id="overlay" onclick="bgClose(event)">
    <div class="modal" id="modal">
      <img class="modal-img" id="mImg" src="" alt="" onerror="this.style.opacity='.25'">
      <div class="modal-body">
        <div class="modal-head">
          <div>
            <div class="modal-title" id="mTitle"></div>
            <div class="modal-artist" id="mArtist"></div>
          </div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div id="mCats"></div>

        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">გამოტოვება</button>
          <button class="btn btn-primary" onclick="saveVotes()">შენახვა</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    let user, images = [], cats = [], votes = {}, curImg = null, filter = 'all';

    async function load() {
      user = requireUser();
      if (!user) return;
      document.getElementById('navUser').textContent = user.name;

      const [iR, cR, vR] = await Promise.all([
        sb.from('images').select('*').order('created_at'),
        sb.from('categories').select('*').order('created_at'),
        sb.from('votes').select('*').eq('user_id', user.id)
      ]);

      images = iR.data || [];
      cats   = cR.data || [];

      votes = {};
      (vR.data || []).forEach(v => { votes[`${v.image_id}|${v.category_id}`] = v.score; });

      renderGrid();
      updateProg();
    }

    function status(img) {
      if (!cats.length) return 'voted';
      const done = cats.filter(c => votes[`${img.id}|${c.id}`] !== undefined).length;
      if (done === 0) return 'unvoted';
      if (done < cats.length) return 'partial';
      return 'voted';
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const list = filter === 'all' ? images
        : filter === 'voted'   ? images.filter(i => status(i) === 'voted')
        : images.filter(i => status(i) !== 'voted');

      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">სურათები არ მოიძებნა</div>';
        return;
      }
      grid.innerHTML = list.map(img => {
        const st = status(img);
        const badge = st === 'voted' ? `<div class="img-badge ok">✓</div>`
          : st === 'partial'         ? `<div class="img-badge partial">…</div>` : '';
        return `
          <div class="img-card${st === 'voted' ? ' voted' : st === 'partial' ? ' partial' : ''}"
               onclick="openImg('${img.id}')">
            <img src="${img.image_url}" alt="${img.title}" loading="lazy" onerror="this.style.opacity='.25'">
            ${badge}
            <div class="img-info">
              <h3>${img.title}</h3>
              <p>${img.artist_name}</p>
            </div>
          </div>`;
      }).join('');
    }

    function updateProg() {
      const done = images.filter(i => status(i) === 'voted').length;
      const pct  = images.length ? Math.round(done / images.length * 100) : 0;
      document.getElementById('progFill').style.width = pct + '%';
      document.getElementById('progText').textContent = `${done} / ${images.length} სურათი`;
      document.getElementById('doneBtn').style.display =
        (done === images.length && images.length > 0) ? 'inline-flex' : 'none';
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function openImg(id) {
      curImg = images.find(i => i.id === id);
      if (!curImg) return;

      document.getElementById('mImg').src = curImg.image_url;
      document.getElementById('mTitle').textContent = curImg.title;
      document.getElementById('mArtist').textContent = curImg.artist_name;

      document.getElementById('mCats').innerHTML = cats.map(cat => {
        const cur = votes[`${curImg.id}|${cat.id}`];
        const btns = Array.from({length: 11}, (_, i) =>
          `<button class="score-btn${cur === i ? ' sel' : ''}"
            onclick="pick('${cat.id}',${i})"
            data-cat="${cat.id}" data-s="${i}">${i}</button>`
        ).join('');
        return `<div class="cat-block">
          <div class="cat-label">${cat.name}</div>
          <div class="score-row">${btns}</div>
        </div>`;
      }).join('');

      document.getElementById('overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function pick(catId, score) {
      document.querySelectorAll(`[data-cat="${catId}"]`).forEach(b => b.classList.remove('sel'));
      document.querySelector(`[data-cat="${catId}"][data-s="${score}"]`).classList.add('sel');
    }

    async function saveVotes() {
      const toSave = [];
      cats.forEach(cat => {
        const btn = document.querySelector(`.score-btn.sel[data-cat="${cat.id}"]`);
        if (btn) toSave.push({
          user_id: user.id, image_id: curImg.id,
          category_id: cat.id, score: parseInt(btn.dataset.s)
        });
      });
      if (!toSave.length) { toast('ერთ კატეგორიას მაინც შეაფასე'); return; }

      const { error } = await sb.from('votes')
        .upsert(toSave, { onConflict: 'user_id,image_id,category_id' });
      if (error) { toast('შეცდომა: ' + error.message); return; }

      toSave.forEach(v => { votes[`${v.image_id}|${v.category_id}`] = v.score; });
      closeModal();
      renderGrid();
      updateProg();
      toast('შეფასება შენახულია ✓');
    }

    function bgClose(e) { if (e.target === document.getElementById('overlay')) closeModal(); }
    function closeModal() {
      document.getElementById('overlay').classList.remove('open');
      document.body.style.overflow = '';
      curImg = null;
    }

    load();
  </script>
</body>
</html>
